<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>塾時間割登録</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="container">
      <!-- ====== 第1層: 常時表示 — 生徒・科目選択 ====== -->
      <header class="toolbar">
        <div class="row">
          <label for="student-combo">生徒選択:</label>
          <div class="student-picker">
            <div class="student-search-wrap">
              <input
                id="student-combo"
                class="student-search"
                type="text"
                placeholder="生徒名を入力して選択"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
              />
              <button id="student-clear-btn" class="clear-btn" type="button" aria-label="検索文字を消す">×</button>
            </div>
            <div id="student-dropdown" class="student-dropdown hidden"></div>
          </div>

          <label for="subject-select">科目選択:</label>
          <select id="subject-select"></select>

          <button id="copy-paste-btn" type="button" class="btn-secondary">コピペ用をコピー</button>
        </div>
        <div id="subject-counts" class="counts"></div>
        <div id="flash-message" class="flash hidden"></div>
      </header>

      <!-- ====== コンテキストバー（生徒＋科目の確認帯） ====== -->
      <div id="context-bar" class="context-bar">
        <span id="context-student" class="context-student"></span>
        <span class="context-sep">|</span>
        <span id="context-subject" class="context-subject"></span>
      </div>

      <!-- ====== 講師パレット（この生徒×この科目で過去に使った講師） ====== -->
      <section id="teacher-palette-section" class="palette-section hidden">
        <div class="palette-label">登録済み講師（ドラッグして配置）</div>
        <div id="teacher-palette" class="palette-chips"></div>
      </section>

      <!-- ====== 第2層: 折りたたみ — 事務メモ ====== -->
      <section class="collapsible-section">
        <button id="memo-section-toggle" class="collapsible-toggle" type="button">
          <span class="toggle-icon">▶</span> 事務メモ
        </button>
        <div id="memo-section-body" class="collapsible-body hidden">
          <div class="student-meta-panel">
            <div class="student-meta-head">
              <div class="student-meta-head-right">
                <button id="student-note-trash-toggle-btn" type="button" class="student-note-trash-toggle-btn">
                  ゴミ箱を表示
                </button>
                <span class="student-note-help">Enter送信 / Shift+Enter改行</span>
              </div>
            </div>
            <div class="row student-meta-status-row">
              <label for="student-status-select">ステータス:</label>
              <select id="student-status-select">
                <option value="調整中">調整中</option>
                <option value="完了">完了</option>
              </select>
            </div>
            <div id="student-note-feed" class="student-note-feed"></div>
            <textarea
              id="student-note-compose-input"
              class="student-note-input"
              placeholder="メモを入力"
              maxlength="500"
            ></textarea>
            <div class="row student-meta-actions">
              <button id="student-note-send-btn" type="button">送信</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ====== 第3層: 折りたたみ — 管理ツール ====== -->
      <section class="collapsible-section">
        <button id="admin-section-toggle" class="collapsible-toggle" type="button">
          <span class="toggle-icon">▶</span> 管理ツール
        </button>
        <div id="admin-section-body" class="collapsible-body hidden">
          <div class="admin-tools-inner">
            <div class="row admin-tools-row">
              <input id="schedule-file-input" type="file" accept=".csv,.xlsx,.xlsm" />
              <button id="sync-upload-btn" type="button">予定表ファイルを取り込む</button>
            </div>
            <div class="row admin-tools-row">
              <button id="reset-assignments-btn" type="button" class="danger">今の登録をリセット</button>
            </div>
            <div id="access-info" class="access-info hidden"></div>
          </div>
        </div>
      </section>

      <!-- ====== コンフリクトバー ====== -->
      <section id="conflict-bar" class="conflict-bar hidden"></section>

      <!-- ====== メイングリッド（時間割） ====== -->
      <section class="grid-wrap">
        <table id="timetable"></table>
      </section>

      <!-- ====== 講師カレンダー ====== -->
      <section class="teacher-panel">
        <button id="teacher-panel-toggle" class="teacher-panel-toggle" type="button">講師カレンダーを表示</button>
        <div id="teacher-panel-body" class="teacher-panel-body hidden">
          <div class="teacher-panel-header">
            <label for="teacher-combo">講師カレンダー:</label>
            <div class="teacher-picker">
              <div class="teacher-search-wrap">
                <input
                  id="teacher-combo"
                  class="teacher-search"
                  type="text"
                  placeholder="講師名を入力して選択"
                  autocomplete="off"
                />
                <button id="teacher-clear-btn" class="clear-btn" type="button" aria-label="検索文字を消す">
                  ×
                </button>
              </div>
              <div id="teacher-dropdown" class="teacher-dropdown hidden"></div>
            </div>
          </div>
          <div id="teacher-subjects" class="teacher-subjects"></div>
          <div id="teacher-note" class="teacher-note hidden"></div>
          <div class="teacher-grid-wrap">
            <table id="teacher-timetable"></table>
          </div>
        </div>
      </section>
    </main>

    <!-- ====== モーダル（講師選択） ====== -->
    <div id="teacher-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <div id="modal-title" class="modal-title"></div>
          <button id="cancel-modal-btn" type="button">キャンセル</button>
        </div>
        <div class="row">
          <label for="table-select">テーブル:</label>
          <select id="table-select"></select>
        </div>
        <div id="teacher-list"></div>
        <button id="remove-assignment-btn" type="button" class="danger hidden">この割り当てを解除</button>
      </div>
    </div>

    <!-- ====== 確認モーダル ====== -->
    <div id="confirm-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-title">確認</div>
        <div id="confirm-message" class="confirm-message"></div>
        <div class="row actions">
          <button id="confirm-no-btn" type="button">キャンセル</button>
          <button id="confirm-yes-btn" type="button" class="danger">反映する</button>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
      // 折りたたみセクションのトグル
      document.querySelectorAll('.collapsible-toggle').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var body = btn.nextElementSibling;
          var icon = btn.querySelector('.toggle-icon');
          if (body.classList.contains('hidden')) {
            body.classList.remove('hidden');
            icon.textContent = '▼';
          } else {
            body.classList.add('hidden');
            icon.textContent = '▶';
          }
        });
      });
    </script>
  </body>
</html>
